# デモ #009 のブラウザ版。端末版 (TodoTerminal) と同じ TODOAPP と TODOSET を動かす
server.port=8080

# 業務の表と会話の表を同じ H2 に置く。STRICT の境界は同じ DataSource でなければ起動時に断る
spring.datasource.url=jdbc:h2:mem:tododb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.schema-locations=classpath:dev/cobolonjava/spring/boot4/cics/cobol-conversation-schema.sql,classpath:todo-schema.sql
spring.sql.init.data-locations=classpath:todo-data.sql

# 画面の遷移と業務の更新を 1 つの UOW で確定する (設計 77 §4.6)
cobol.cics.conversation.consistency=strict

# デモ環境の簡易認証 (設計 84)。本番の利用者管理の代わりにはならない
cobol.cics.security.mode=demo
cobol.cics.security.users[0].username=demo
cobol.cics.security.users[0].password={noop}demo
cobol.cics.security.users[0].user-id=DEMOUSER
cobol.cics.security.users[0].transactions[0]=TODO
