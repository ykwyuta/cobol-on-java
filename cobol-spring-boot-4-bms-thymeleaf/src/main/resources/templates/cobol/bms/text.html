<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8">
  <title>CICS</title>
</head>
<body th:attr="data-terminal-events=${terminalEvents},data-terminal-screen=${terminalScreen},data-screen-version=${screenVersion}">
<pre class="bms-text" th:text="${text}"></pre>
<form th:if="${conversation}" method="post" th:action="${action}">
  <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
  <input th:if="${idempotencyKey != null}" type="hidden" name="idempotencyKey" th:value="${idempotencyKey}">
  <th:block th:if="${conversationId != null}">
    <input type="hidden" name="conversationId" th:value="${conversationId}">
    <input type="hidden" name="conversationVersion" th:value="${conversationVersion}">
  </th:block>
  <input th:if="${screenVersion != null}" type="hidden" name="screenVersion" th:value="${screenVersion}">
  <button type="submit" name="aid" value="ENTER">Enter</button>
  <button type="submit" name="aid" value="CLEAR">Clear</button>
</form>
<script th:if="${bmsAssets != null}" type="module" th:src="${bmsAssets + '/terminal.js'}"></script>
</body>
</html>
