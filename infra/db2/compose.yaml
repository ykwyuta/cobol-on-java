name: cobol-on-java-db2

services:
  db2:
    image: icr.io/db2_community/db2:12.1.5.0
    hostname: db2server
    privileged: true
    restart: unless-stopped
    ports:
      - "${DB2_PORT:-50000}:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: ${DB2_USER:-db2inst1}
      DB2INST1_PASSWORD: ${DB2_PASSWORD:?set DB2_PASSWORD in infra/db2/.env}
      DBNAME: ${DB2_DATABASE:-COBOLDB}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      IS_OSXFS: "false"
      PERSISTENT_HOME: "false"
      HADR_ENABLED: "false"
      ETCD_ENDPOINT: ""
      ETCD_USERNAME: ""
      ETCD_PASSWORD: ""
    volumes:
      - db2-data:/database
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          su - ${DB2_USER:-db2inst1} -c
          'db2 connect to ${DB2_DATABASE:-COBOLDB} >/dev/null 2>&1'
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 5m
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G

volumes:
  db2-data:
