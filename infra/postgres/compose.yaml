name: cobol-on-java-postgres

services:
  postgres:
    image: postgres:17-alpine
    hostname: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cobol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/postgres/.env}
      POSTGRES_DB: ${POSTGRES_DB:-imsdb}
      # 生バイトの比較と HIERARCHY_PATH の並びを、照合順序に左右されない形で確かめるため
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-cobol} -d ${POSTGRES_DB:-imsdb}
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

volumes:
  postgres-data:
