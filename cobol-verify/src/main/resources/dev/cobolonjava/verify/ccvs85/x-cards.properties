# ---- 文字集合まわり ----
#
# 081 は COBOL の文字集合に<b>入っていない</b>文字を 8 つ。
# 090 / 091 は "A" と "D" が native の文字集合で何番目かである
# (1 から数える)。既定は EBCDIC (IBM-1047) なので 0xC1 と 0xC4 の次の数になる。

081 = "!?_|~^[]"
090 = 194
091 = 197

# ---- ラベルの中身 (VALUE OF)。規格の廃要素であり、こちらでは読んで捨てる ----
#
# 074 が実装者名、075〜077 がその値である。ファイルごとに 1 つずつ要る。

074 = DSNAME
075 = "CCVSFIL1"
076 = "CCVSFIL2"
077 = "CCVSFIL3"

# ---- 呼び名 (SPECIAL-NAMES の実装者名) ----
#
# 056 が DISPLAY の行き先、057 が ACCEPT の来し方である。073 も同じ形で使う。

057 = SYSIN
073 = SYSOUT

# ---- 動かす機械の指定。OBJECT-COMPUTER に書く。翻訳の結果には効かない ----

067 = 9999 CHARACTERS
068 = 9999 CHARACTERS

# ---- 順編成のレコードの切り方 ----

070 = STANDARD-1

# ---- 入出力の制御 (I-O-CONTROL)。規格の廃要素であり、読んで捨てる ----

053 = RERUN EVERY 1000 RECORDS

# ---- 写し句を引く原本の置き場 (COPY ... OF <library>) ----

047 = ALTLB
048 = ALTL1

# ---- 整列の検査が使う、native の文字集合 51 文字 ----
#
# 063 が昇順、064 が降順である。<b>並びは処理系の照合順序で決まる</b>。
# 配布物の見本は ASCII の並びなので、そのままでは使えない。既定の EBCDIC
# (IBM-1047) の昇順で 51 文字を選んである。引用符は入れてはならない決まりである。
# 065 は整列にかけるレコードの本数で、51 の倍数でなければならない。

063 = " .<(+&$*);-/,>=ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
064 = "9876543210ZYXWVUTSRQPONMLKJIHGFEDCBA=>,/-;)*$&+(<. "
065 = 510

# ---- 項目の書き方 ----

086 = PICTURE X(8)

# ---- 通信 (CM) が使う待ち行列・端末・合言葉の名前 ----
#
# どれも「外の世界で何と呼ぶか」であって規格が決めるものではない。
# 桁数は使われる項目に合わせてある (VALUE が PIC より長いと翻訳が断るので、
# <b>札のほうが処理系の失敗を作る</b>ことになる)。

030 = "CCVSQUEUE1"
031 = "CCVSPASS01"
032 = "CCVSDEST01"
033 = "CCVSPASS02"
034 = "CCVS COMMUNICATION TEST MESSAGE FOR QUEUE NUMBER 2    "
035 = "CCVSDEST02"
036 = "CCVSPASS03"
037 = "CCVSPASS04"
038 = "CCVSQUEUE-PPPP"
039 = "CCVSQUEUE-PPPS"
040 = "CCVSQUEUE-PPSP"
041 = "CCVSQUEUE-PSPP"
042 = "CCVSTERM01"
043 = "CCVSTERM02"

# ---- 外から立てる切り替え (UPSI) ----
#
# ジョブが立てたところをプログラムが読む。参照実装は UPSI-0 から UPSI-7 の 8 個を持つ。

051 = UPSI-0
052 = UPSI-1
