# CCVS85 の差し込み札 (要件 NFR-040)。
#
# 番号 = 埋める文字。検査プログラムの XXXXXnnn がこの文字へ置き換わる。
# 用意していない番号は置き換えず、検査の道具が「札が足りない」と報せる。
# 黙って残すと、処理系が受け付けられなかったのか札を書き忘れたのかが
# 区別できなくなるからである。
#
# ここに書く値は<b>処理系ごとに違うもの</b>であり、規格が決めているものではない。
# ファイルの札はどれも「このファイルを外の世界で何と呼ぶか」であり、こちらでは
# DD 名になる。中身は何でもよいので、札の番号をそのまま名前にしている。

# 装置の名前。何を書いてもよい
082 = COBOL-ON-JAVA
083 = COBOL-ON-JAVA

# ラベルの指定。書くことが無ければこう書く決まりである
084 = OMITTED

# 印字するファイル
