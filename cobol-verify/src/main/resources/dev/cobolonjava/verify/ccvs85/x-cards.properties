# CCVS85 の差し込み札 (要件 NFR-040)。
#
# 番号 = 埋める文字。検査プログラムの XXXXXnnn がこの文字へ置き換わる。
# 用意していない番号は置き換えず、検査の道具が「札が足りない」と報せる。
# 黙って残すと、処理系が受け付けられなかったのか札を書き忘れたのかが
# 区別できなくなるからである。
#
# ここに書く値は<b>処理系ごとに違うもの</b>であり、規格が決めているものではない。
# ファイルの札はどれも「このファイルを外の世界で何と呼ぶか」であり、こちらでは
# DD 名になる。中身は何でもよいので、札の番号をそのまま名前にしている。

# 装置の名前。何を書いてもよい
082 = COBOL-ON-JAVA
083 = COBOL-ON-JAVA

# ラベルの指定。書くことが無ければこう書く決まりである
084 = OMITTED

# 印字するファイル
055 = PRINT-FILE

# 呼び名が指す機能名。DISPLAY の行き先である
056 = SYSOUT

# ---- ファイルの結び付け (ASSIGN TO の相手) ----
#
# EX (起こしの駆動), NC (基本), SQ (順編成), RL (相対編成), IX (索引編成),
# ST (整列), SG (段分け), SM (写し句), RW (報告書), DB (デバッグ) が使う。

001 = CCVS001
002 = CCVS002
003 = CCVS003
004 = CCVS004
006 = CCVS006
008 = CCVS008
009 = CCVS009
013 = CCVS013
014 = CCVS014
015 = CCVS015
016 = CCVS016
017 = CCVS017
018 = CCVS018
019 = CCVS019
021 = CCVS021
022 = CCVS022
023 = CCVS023
024 = CCVS024
025 = CCVS025
026 = CCVS026
027 = CCVS027
028 = CCVS028
029 = CCVS029
044 = CCVS044
045 = CCVS045
046 = CCVS046
049 = CCVS049
